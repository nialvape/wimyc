services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/wimyc.db
    volumes:
      - ./data:/data
    ports:
      # Sólo en loopback: el que lo publica es el reverse proxy del host.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Caddy opcional, para un VPS que no tenga ya un reverse proxy. No arranca
  # salvo que lo pidas: `docker compose --profile proxy up -d`.
  # Si el host ya tiene uno, apuntalo a 127.0.0.1:3000 y no uses este perfil.
  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
